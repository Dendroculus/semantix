version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      compose-image-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      backend-image-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      frontend-image-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      backend-production-patches:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
      backend-development-patches:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      frontend-production-patches:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
      frontend-development-patches:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch
