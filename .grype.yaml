ignore:
  # Grype treats cross-minor and prerelease CPython fixes as actionable for
  # Python 3.11. Keep every exception tied to the reviewed runtime version so
  # the next patch update requires a fresh assessment.
  - vulnerability: CVE-2026-15308
    reason: No compatible fix is published for the supported CPython 3.11 line.
    package:
      name: python
      version: 3.11.15
      type: binary

